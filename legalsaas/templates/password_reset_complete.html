{% load i18n %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Mot de passe réinitialisé — LegalSaas" %}</title>
    {% include '_theme.html' %}
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0A1E3C, #0D2B57);
        }
        .card-centre {
            background: var(--card);
            width: 440px;
            max-width: 92%;
            padding: 44px 40px;
            border-radius: 12px;
            text-align: center;
        }
        .card-centre .balance { font-size: 72px; margin-bottom: 18px; }
        .card-centre h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; }
        .card-centre p { font-size: 15px; color: var(--muted); line-height: 1.7; }
        .card-centre .btn {
            display: inline-block;
            margin-top: 24px;
            background: #0A1E3C;
            color: #FFFFFF;
            padding: 13px 26px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
        }
        .card-centre .btn:hover { background: #14325E; }
        .theme-cornertop { position: fixed; top: 16px; right: 20px; z-index: 10; }
    </style>
</head>
<body>
    <div class="theme-cornertop">{% include '_theme_toggle.html' %}</div>
    <div class="card-centre">
        <div class="balance">✅</div>
        <h1>{% trans "Mot de passe réinitialisé" %}</h1>
        <p>{% trans "Votre mot de passe a bien été modifié. Vous pouvez maintenant vous connecter." %}</p>
        <a class="btn" href="{% url 'login' %}">{% trans "Se connecter" %}</a>
    </div>
</body>
</html>
